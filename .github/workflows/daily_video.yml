name: Publicar Video Diario Rattle

on:
  schedule:
    - cron: "30 20 * * *" # Todos los días a las 20:30 UTC (14:30 CDMX)
  workflow_dispatch:

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update apt package database
        run: sudo apt-get update

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests python-dotenv google-generativeai

      - name: Install Root dependencies
        run: npm install axios dotenv form-data

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install video_rattle dependencies
        run: |
          cd video_rattle
          npm install

      - name: Generate Rattle Script & Robotic Audio
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd video_rattle
          python generate_rattle_video.py

      - name: Render Video (HyperFrames)
        run: |
          cd video_rattle
          mkdir -p out
          npx hyperframes render -o out/rattle_video.mp4

      - name: Publish to TikTok, Instagram Reels & YouTube Shorts
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REDIRECT_URI: ${{ secrets.TIKTOK_REDIRECT_URI }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS }}
        run: |
          cd video_rattle
          node publish_video.js

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rattle-video-${{ github.run_number }}
          path: video_rattle/out/rattle_video.mp4
          retention-days: 3

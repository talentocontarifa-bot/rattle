name: Rattle Daily Report

on:
  schedule:
    - cron: "15 11 * * *" # 06:15 CDMX
    - cron: "45 23 * * *" # 18:45 CDMX
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-daily-report]

concurrency:
  group: rattle-state
  cancel-in-progress: false

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # FIX: sin esto, el git push final fallaba con 403 en cada corrida
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium || true

      - name: Install Obscura (Headless Stealth Browser Engine)
        continue-on-error: true
        run: |
          curl -sLO https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.3/obscura-x86_64-linux-stealth.tar.gz
          tar -xzf obscura-x86_64-linux-stealth.tar.gz
          chmod +x obscura obscura-worker 2>/dev/null || true
          sudo mv obscura /usr/local/bin/ || true
          if [ -f obscura-worker ]; then sudo mv obscura-worker /usr/local/bin/ || true; fi
          rm -f obscura-x86_64-linux-stealth.tar.gz

      - name: Run Daily Report Task
        timeout-minutes: 12
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KOFI_STORAGE_STATE: ${{ secrets.KOFI_STORAGE_STATE }}
        run: python rattle.py daily

      - name: Commit Database and Root Pages Changes
        if: always()
        run: |
          bash scripts/commit_state.sh "chore: update sqlite db & pages [skip ci]"

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash scripts/telegram_alert.sh "🚨 Rattle daily report FALLÓ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

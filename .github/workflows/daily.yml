name: Rattle Daily Report

on:
  schedule:
    - cron: "15 11 * * *" # Runs at 06:15 UTC-5 (6:15 AM)
    - cron: "45 23 * * *" # Runs at 18:45 UTC-5 (6:45 PM)
  workflow_dispatch: # Allow manual trigger
  repository_dispatch:
    types: [trigger-daily-report]

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium || true

      - name: Install Obscura (Headless Stealth Browser Engine)
        run: |
          curl -sLO https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.3/obscura-x86_64-linux-stealth.tar.gz
          tar -xzf obscura-x86_64-linux-stealth.tar.gz
          chmod +x obscura obscura-worker 2>/dev/null || true
          sudo mv obscura /usr/local/bin/ || true
          if [ -f obscura-worker ]; then sudo mv obscura-worker /usr/local/bin/ || true; fi
          rm -f obscura-x86_64-linux-stealth.tar.gz

      - name: Run Daily Report Task
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KOFI_STORAGE_STATE: ${{ secrets.KOFI_STORAGE_STATE }}
        run: python rattle.py daily

      - name: Commit Database and Root Pages Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rattle.db rattle_knowledge.json index.html
          if [ -f last_image.png ]; then git add last_image.png; fi
          if [ -f last_voice.mp3 ]; then git add last_voice.mp3; fi
          git diff --staged --quiet || (git commit -m "chore: update sqlite db & pages [skip ci]" && git pull --rebase && git push)

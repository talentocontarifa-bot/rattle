name: Rattle Scheduled Task

on:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours
  workflow_dispatch: # Allow manual trigger

# Evita que hourly/daily choquen al hacer git push sobre rattle.db
concurrency:
  group: rattle-state
  cancel-in-progress: false

jobs:
  run-scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # Falla rápido si el prompt (f-string) está roto, antes de gastar cuota de LLM
      - name: Sanity check (prompt regression tests)
        env:
          GEMINI_API: dummy
        run: python -m pytest tests -q

      # Remotion solo se necesita en corridas manuales (en schedule el modo silencioso prohíbe video)
      - name: Set up Node.js (manual runs only)
        if: github.event_name != 'schedule'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies + Remotion browser (manual runs only)
        if: github.event_name != 'schedule'
        run: |
          npm install
          npx remotion browser install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Setup Obscura (Rust Headless Browser)
        continue-on-error: true
        run: |
          mkdir -p bin
          curl -sL https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.3/obscura-x86_64-linux.tar.gz | tar -xz -C bin
          chmod +x bin/obscura bin/obscura-worker 2>/dev/null || true
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Run Scheduled Task
        timeout-minutes: 12
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          KOFI_STORAGE_STATE: ${{ secrets.KOFI_STORAGE_STATE }}
        run: python rattle.py hourly

      - name: Commit Database Changes
        if: always()
        run: |
          bash scripts/commit_state.sh "chore: update sqlite db, knowledge & pages [skip ci]"

      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash scripts/telegram_alert.sh "🚨 Rattle hourly FALLÓ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

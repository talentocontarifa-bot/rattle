name: Rattle Scheduled Task

on:
  schedule:
    - cron: "0 */4 * * *" # Every 4 hours (6 times a day instead of 24)
  workflow_dispatch: # Allow manual trigger

jobs:
  run-scheduled:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Enable pip caching

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Enable npm caching

      - name: Install Node dependencies
        run: npm install

      - name: Install Remotion Browser
        run: npx remotion browser install

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Run Scheduled Task
        env:
          GEMINI_API: ${{ secrets.GEMINI_API }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python rattle.py hourly

      - name: Commit Database Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rattle.db rattle_knowledge.json index.html
          if [ -f last_image.png ]; then git add last_image.png; fi
          if [ -f last_voice.mp3 ]; then git add last_voice.mp3; fi
          git diff --staged --quiet || (git commit -m "chore: update sqlite db, knowledge & pages [skip ci]" && git pull --rebase && git push)
